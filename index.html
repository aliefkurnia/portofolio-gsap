    <!-- Theme — applied before first paint so the wrong palette never flashes.
         The two colours mirror --bg in src/styles/variables.css; the browser
         chrome has to be told separately because it can't read CSS vars. -->
    <script>
      (function () {
        var BG = { light: '#f5edd8', dark: '#17120f' };
        var theme = 'light';
        try {
          theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          /* private mode — fall through to light */
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', BG[theme]);
      })();
    </script>

    <!-- Fonts — pixel display + neutral body -->
